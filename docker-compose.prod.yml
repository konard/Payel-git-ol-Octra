services:
  postgres:
    image: postgres:15-alpine
    container_name: octra-postgres
    environment:
      POSTGRES_USER: crewai
      POSTGRES_PASSWORD: crewai_password
      POSTGRES_DB: crewai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - octra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octra"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: octra-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - octra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: ./orchestrator/Dockerfile
    container_name: octra-orchestrator
    environment:
      - DB_DNS=host=postgres user=octra password=${POSTGRES_PASSWORD:-octra_password} dbname=octra port=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - AGENTS_SERVICE_HOST=agents:50053
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - PROJECTS_DIR=/workspace/projects
    volumes:
      - ./projects:/workspace/projects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agents:
        condition: service_started
    networks:
      - octra-network
    restart: unless-stopped

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile.prod
    container_name: octra-agents
    environment:
      - AGENTS_PORT=50053
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "50053:50053"
    networks:
      - octra-network
    restart: unless-stopped

  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: octra-apigateway
    environment:
      - NODES_SERVICE_HOST=orchestrator:50052
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - AUTH_SERVICE_HOST=user:3112
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_TASK_CREATE=${RATE_LIMIT_TASK_CREATE:-10/60}
      - RATE_LIMIT_TASK_STATUS=${RATE_LIMIT_TASK_STATUS:-60/60}
      - RATE_LIMIT_TASK_RECONNECT=${RATE_LIMIT_TASK_RECONNECT:-30/60}
    ports:
      - "3111:3111"
    depends_on:
      orchestrator:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - octra-network
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: ./user/Dockerfile
    container_name: octra-user
    env_file:
      - .env.prod
    environment:
      - DB_DNS=host=postgres user=crewai password=${POSTGRES_PASSWORD:-crewai_password} dbname=crewai port=5432
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-refresh-in-production}
      - AUTH_PORT=3112
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
    ports:
      - "3112:3112"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - octra-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        - VITE_FRONTEND_MODE
    container_name: octra-frontend
    env_file:
      - .env.prod
    ports:
      - "70:80"
    depends_on:
      user:
        condition: service_started
      apigateway:
        condition: service_started
    networks:
      - octra-network
    restart: unless-stopped

networks:
  octra-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: