<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octra screenshot harness</title>
    <script>
      // Pin the UI to English deterministically. The unauthenticated i18n store
      // fires a geolocation lookup (api.ipbase.com) at module-evaluation time that
      // can flip the language away from English mid-capture (the cause of the old
      // mixed-language screenshots, e.g. a French "Connexion" button). This inline
      // script runs before the deferred module below, so it intercepts that lookup
      // and forces a country that maps to English.
      (function () {
        const realFetch = window.fetch ? window.fetch.bind(window) : null;
        window.fetch = function (input, init) {
          const url = typeof input === 'string' ? input : input && input.url;
          if (url && url.includes('api.ipbase.com')) {
            return Promise.resolve(
              new Response(JSON.stringify({ country_code: 'US' }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' },
              }),
            );
          }
          if (!realFetch) return Promise.reject(new Error('fetch unavailable'));
          return realFetch(input, init);
        };
      })();
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/screenshot/main.tsx"></script>
  </body>
</html>
