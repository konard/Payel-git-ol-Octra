<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lock down the renderer: no remote content, no inline-eval beyond our own scripts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
    />
    <title>Octra Desktop</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/chrome.css" />
    <link rel="stylesheet" href="styles/workspace.css" />
  </head>
  <!-- `data-has-project` flips the chrome between the welcome screen (no project)
       and the full three-pane workspace; it also gates the File/Edit/… menu bar,
       which must not appear until a project is open (PR #49 review feedback). -->
  <body data-has-project="false">
    <div id="app">
      <!-- Zed-style title bar (reference 2) -->
      <header class="titlebar" role="banner">
        <div class="titlebar__group">
          <button
            id="app-menu-button"
            class="tb-btn tb-btn--icon"
            title="Open Application Menu"
            aria-label="Open Application Menu"
            aria-haspopup="true"
            aria-expanded="false"
          ></button>

          <div class="breadcrumb">
            <button id="project-chip" class="tb-btn breadcrumb__chip" aria-haspopup="true" aria-expanded="false">
              <span id="project-name">No Project</span>
            </button>
            <!-- Branch chips only make sense once a project is open. -->
            <span class="breadcrumb__sep">/</span>
            <span id="branch-remote" class="breadcrumb__branch"></span>
            <span class="breadcrumb__sep">/</span>
            <span id="branch-local" class="breadcrumb__branch"></span>
          </div>

          <!-- Full application menu bar (reference 3); hidden until a project is open. -->
          <nav id="menubar" class="menubar" aria-label="Application menu"></nav>
        </div>

        <div class="titlebar__spacer"></div>

        <div class="titlebar__group">
          <span class="avatar" title="Account">O</span>
          <div class="window-controls">
            <button id="win-min" class="window-controls__btn" title="Minimize" aria-label="Minimize"></button>
            <button id="win-max" class="window-controls__btn" title="Maximize" aria-label="Maximize"></button>
            <button id="win-close" class="window-controls__btn window-controls__btn--close" title="Close" aria-label="Close"></button>
          </div>
        </div>
      </header>

      <!-- Octra web-style application toolbar (mirrors frontend/web TopBar). -->
      <div class="appbar">
        <div class="appbar__group">
          <button id="toggle-sessions" class="appbar__icon is-active" title="Toggle Sessions panel" aria-pressed="true"></button>
          <button id="new-chat" class="appbar__icon" title="New Chat"></button>
          <span class="appbar__gap"></span>
          <img id="appbar-mascot" class="appbar__mascot" alt="Octra" />
          <h1 class="appbar__title">Octra</h1>
        </div>
        <div class="appbar__group appbar__group--right">
          <button id="theme-toggle" class="appbar__icon" title="Toggle theme"></button>
          <button id="open-settings" class="appbar__icon" title="Settings"></button>
          <button id="account" class="appbar__icon" title="Account"></button>
        </div>
      </div>

      <!-- Body: swaps between the welcome screen and the three-pane workspace. -->
      <main class="body">
        <!-- Welcome / no-project screen (reference 1 mascot + reference 4 recents). -->
        <section id="welcome" class="welcome">
          <div class="welcome__card">
            <img id="welcome-mascot" class="welcome__mascot" alt="Octra mascot" />
            <h2 class="welcome__title">Octra Desktop</h2>
            <p class="welcome__subtitle">Open an existing project or create a new one to get started.</p>
            <div class="welcome__cta">
              <button id="welcome-open" class="btn-ghost">Open Project</button>
              <button id="welcome-new" class="btn-accent">New Project</button>
            </div>
            <div id="welcome-recents" class="welcome__recents"></div>
          </div>
        </section>

        <!-- Three-pane workspace (mirrors the live web UI). -->
        <section id="workspace" class="workspace">
          <!-- Left: Sessions / История -->
          <aside id="sessions-pane" class="pane pane--sessions">
            <div class="pane__head">
              <div class="pane__title"><span class="pane__badge" id="sessions-icon"></span><span>История</span></div>
              <button id="sessions-new" class="chip-btn"><span id="sessions-new-icon"></span>Новый чат <kbd>Ctrl+N</kbd></button>
            </div>
            <div class="pane__body sessions__empty">Чатов пока нет</div>
            <div class="pane__foot"><span id="sessions-count">0</span> sessions</div>
          </aside>

          <!-- Center: Canvas + Chat + shared input -->
          <div class="pane pane--center">
            <div class="canvas">
              <button id="add-agent" class="btn-accent canvas__add">+ Добавить агента</button>
              <div class="canvas__grid"></div>
              <div class="canvas__zoom">
                <button class="zoom-btn" id="zoom-in" title="Zoom in"></button>
                <button class="zoom-btn" id="zoom-out" title="Zoom out"></button>
                <button class="zoom-btn" id="zoom-fit" title="Fit view"></button>
                <button class="zoom-btn" id="zoom-export" title="Export"></button>
              </div>
            </div>
            <div class="center__divider"></div>
            <div class="chat">
              <img id="chat-mascot" class="chat__mascot" alt="Octra" />
              <div class="chat__status">Ready.</div>
            </div>
            <div class="composer">
              <textarea class="composer__input" rows="1" placeholder="Опишите задачу… Например: Напиши прокси сервис на Go с маршрутизацией и балансировкой нагрузки"></textarea>
              <div class="composer__row">
                <div class="composer__selectors">
                  <button class="pill"><span id="env-icon"></span>env<span id="env-caret"></span></button>
                  <button class="pill"><span id="model-icon"></span>claude-4.7-opus<span id="model-caret"></span></button>
                </div>
                <div class="composer__actions">
                  <button class="composer__icon" id="attach" title="Attach"></button>
                  <button class="composer__icon" id="globe" title="Web access"></button>
                  <button class="composer__send btn-accent" id="send" title="Send"></button>
                </div>
              </div>
            </div>
          </div>

          <!-- Right: Solution files -->
          <aside class="pane pane--solution">
            <div class="pane__head">
              <div class="pane__title"><span id="solution-icon"></span><span>Solution files</span></div>
            </div>
            <div class="pane__body solution__empty">
              <span id="solution-empty-icon" class="solution__empty-icon"></span>
              <p>No generated files yet.</p>
            </div>
          </aside>
        </section>
      </main>

      <!-- Bottom console bar (mirrors the web "Консоль" dock). -->
      <footer class="console">
        <button class="console__toggle" id="console-toggle">
          <span id="console-icon"></span><span class="console__label">Консоль</span><span class="console__count">(0)</span>
        </button>
        <span id="console-chevron" class="console__chevron"></span>
      </footer>
    </div>

    <!-- Backdrop + layer that hosts all dropdown panels -->
    <div class="backdrop"></div>
    <div id="dropdown-layer"></div>

    <!-- Shared model first, then renderer modules (classic scripts so file:// works) -->
    <script src="js/menuModel.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dropdown.js"></script>
    <script src="js/appMenu.js"></script>
    <script src="js/projectSwitcher.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
