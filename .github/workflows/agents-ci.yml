name: Agents CI

on:
  push:
    branches: [master, main]
    paths:
      - 'agents/**'
      - '.github/workflows/agents-ci.yml'
  pull_request:
    paths:
      - 'agents/**'
      - '.github/workflows/agents-ci.yml'

concurrency:
  group: agents-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & vet (agents)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache-dependency-path: agents/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
