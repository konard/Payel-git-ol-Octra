name: User Service CI

on:
  push:
    branches: [master, main]
    paths:
      - 'user/**'
      - '.github/workflows/user-ci.yml'
  pull_request:
    paths:
      - 'user/**'
      - '.github/workflows/user-ci.yml'

concurrency:
  group: user-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (user)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache-dependency-path: user/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1
