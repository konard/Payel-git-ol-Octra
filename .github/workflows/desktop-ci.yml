name: Desktop CI

on:
  push:
    branches: [master, main]
    paths:
      - 'frontend/desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'frontend/desktop/**'
      - '.github/workflows/desktop-ci.yml'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (frontend/desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/desktop/package-lock.json

      # Install dev deps (TypeScript + @types/node) to compile the main process.
      # The tests never launch Electron, so skip its large binary download.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # `npm test` compiles electron/*.ts (tsc) and runs the unit tests for the
      # filesystem reader, recent-projects store, menu model, static server and
      # the main/preload IPC contract.
      - name: Run tests
        run: npm test
