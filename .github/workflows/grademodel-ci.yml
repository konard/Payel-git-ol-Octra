name: Grade Model CI

on:
  push:
    branches: [master, main]
    paths:
      - 'grademodel/**'
      - '.github/workflows/grademodel-ci.yml'
  pull_request:
    paths:
      - 'grademodel/**'
      - '.github/workflows/grademodel-ci.yml'

concurrency:
  group: grademodel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (grademodel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grademodel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest test/ -v
