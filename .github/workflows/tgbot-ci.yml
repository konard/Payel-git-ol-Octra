name: Telegram Bot CI

on:
  push:
    branches: [master, main]
    paths:
      - 'tgbot/**'
      - '.github/workflows/tgbot-ci.yml'
  pull_request:
    paths:
      - 'tgbot/**'
      - '.github/workflows/tgbot-ci.yml'

concurrency:
  group: tgbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & syntax check (tgbot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tgbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint with ruff
        run: ruff check src/

      - name: Check syntax
        run: python -m py_compile src/main.py src/config.py src/keyboards.py src/states.py
