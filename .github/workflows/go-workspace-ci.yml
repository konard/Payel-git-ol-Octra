name: Go Workspace CI

on:
  push:
    branches: [master, main]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**.go'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/go-workspace-ci.yml'
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**.go'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/go-workspace-ci.yml'

concurrency:
  group: go-workspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all Go modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Build all modules
        run: go build ./agents/... ./apigateway/... ./orchestrator/... ./user/...

      - name: Vet all modules
        run: go vet ./agents/... ./apigateway/... ./orchestrator/... ./user/...
