<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: #0f0f1a; overflow: hidden; }
  .topbar { height: 56px; background: #1a1a2e; border-bottom: 1px solid #3a3a5c; }
  .stage { position: relative; height: 100vh; }
  /* ===== CURRENT (before) implementation copied from theme.css ===== */
  .ambient-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: var(--ambient-opacity, 0.45);
    transition: opacity 600ms ease, background 800ms ease;
    background:
      radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--ambient-color-a, #7c4dff) 55%, transparent) 0%, transparent 45%),
      radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, var(--ambient-color-b, #00e5ff) 55%, transparent) 0%, transparent 45%);
    -webkit-mask-image: linear-gradient(to right, #000 0 14%, transparent 14% 86%, #000 86% 100%),
      linear-gradient(to bottom, #000 0 16%, transparent 16% 84%, #000 84% 100%);
    -webkit-mask-composite: source-over;
    mask-image: linear-gradient(to right, #000 0 14%, transparent 14% 86%, #000 86% 100%),
      linear-gradient(to bottom, #000 0 16%, transparent 16% 84%, #000 84% 100%);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="topbar"></div>
    <div class="ambient-glow" style="--ambient-color-a:#ec4899; --ambient-color-b:#7c4dff"></div>
  </div>
</body>
</html>
