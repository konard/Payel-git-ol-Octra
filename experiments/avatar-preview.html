<!doctype html>
<!--
  Visual preview for the isometric voxel avatar generator (issue #42).
  The drawing logic here mirrors frontend/web/src/utils/avatar.ts so we can
  eyeball several seeds at once and screenshot the result.
-->
<html>
<head><meta charset="utf-8"><style>
  body { background:#0a0a0a; margin:0; padding:24px; font-family:sans-serif; }
  .grid { display:flex; flex-wrap:wrap; gap:18px; }
  .cell { text-align:center; color:#888; font-size:12px; }
  canvas { border-radius:50%; border:3px solid #5a4030; box-shadow:0 4px 14px rgba(0,0,0,.5); }
</style></head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
const GRID = 5, MAX_HEIGHT = 4;
function mulberry32(seed){let a=seed>>>0;return()=>{a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function seedFromHash(hash){let h=0x811c9dc5;for(let i=0;i<hash.length;i++){h^=hash.charCodeAt(i);h=Math.imul(h,0x01000193);}return h>>>0;}
const hsl=(h,s,l)=>`hsl(${h}, ${s}%, ${l}%)`;
function buildPalette(rng){const baseHue=Math.floor(rng()*360);const accentHue=(baseHue+150+Math.floor(rng()*60))%360;const sat=45+Math.floor(rng()*25);return{bgInner:hsl(baseHue,Math.max(0,sat-25),16),bgOuter:hsl(baseHue,Math.max(0,sat-30),6),ring:hsl((baseHue+20)%360,32,40),top:[hsl(baseHue,sat,62),hsl(accentHue,14,92)],left:[hsl(baseHue,sat,44),hsl(accentHue,14,74)],right:[hsl(baseHue,sat,30),hsl(accentHue,14,60)]};}
function generateAvatarDescriptor(hash){const rng=mulberry32(seedFromHash(hash));const palette=buildPalette(rng);const heights=new Array(GRID*GRID).fill(0);const materials=new Array(GRID*GRID).fill(0);const center=(GRID-1)/2;const half=Math.ceil(GRID/2);for(let y=0;y<GRID;y++){for(let x=0;x<half;x++){const dist=Math.abs(x-center)+Math.abs(y-center);const bias=Math.max(0,MAX_HEIGHT-dist);let h=Math.round(bias*0.5+rng()*(MAX_HEIGHT-bias*0.4));h=Math.max(0,Math.min(MAX_HEIGHT,h));const mat=rng()<0.3?1:0;const mx=GRID-1-x;heights[y*GRID+x]=h;heights[y*GRID+mx]=h;materials[y*GRID+x]=mat;materials[y*GRID+mx]=mat;}}const ci=Math.floor(center)*GRID+Math.floor(center);if(heights[ci]<2)heights[ci]=2;return{grid:GRID,heights,materials,palette};}
function polygon(ctx,pts,fill){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=fill;ctx.lineWidth=1;ctx.stroke();}
function drawAvatar(ctx,size,d){const bg=ctx.createRadialGradient(size*0.42,size*0.36,size*0.04,size*0.5,size*0.5,size*0.72);bg.addColorStop(0,d.palette.bgInner);bg.addColorStop(1,d.palette.bgOuter);ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);const grid=d.grid;const tw=size*0.17,th=tw/2,ch=tw*0.62,ox=size/2,oy=size*0.30;const project=(gx,gy,z)=>[ox+(gx-gy)*(tw/2),oy+(gx+gy)*(th/2)-z*ch];const drawCube=(gx,gy,z,mat)=>{const[cx,cy]=project(gx,gy,z);polygon(ctx,[[cx,cy],[cx+tw/2,cy+th/2],[cx,cy+th],[cx-tw/2,cy+th/2]],d.palette.top[mat]);polygon(ctx,[[cx-tw/2,cy+th/2],[cx,cy+th],[cx,cy+th+ch],[cx-tw/2,cy+th/2+ch]],d.palette.left[mat]);polygon(ctx,[[cx,cy+th],[cx+tw/2,cy+th/2],[cx+tw/2,cy+th/2+ch],[cx,cy+th+ch]],d.palette.right[mat]);};const cells=[];for(let gy=0;gy<grid;gy++)for(let gx=0;gx<grid;gx++)cells.push({gx,gy});cells.sort((a,b)=>a.gx+a.gy-(b.gx+b.gy));for(const{gx,gy}of cells){const idx=gy*grid+gx;const h=d.heights[idx];const mat=d.materials[idx];for(let z=0;z<h;z++)drawCube(gx,gy,z,mat);}ctx.beginPath();ctx.arc(size/2,size/2,size/2-size*0.025,0,Math.PI*2);ctx.strokeStyle=d.palette.ring;ctx.lineWidth=size*0.03;ctx.stroke();}

const seeds=['user-1','alice@example.com','0x4358f7abf391','bob','dbac8b8e','charlie','octra','42','zoe@mail.io','random-seed-99'];
const grid=document.getElementById('grid');
for(const s of seeds){const wrap=document.createElement('div');wrap.className='cell';const c=document.createElement('canvas');c.width=200;c.height=200;c.style.width='120px';c.style.height='120px';drawAvatar(c.getContext('2d'),200,generateAvatarDescriptor(s));wrap.appendChild(c);const label=document.createElement('div');label.textContent=s;wrap.appendChild(label);grid.appendChild(wrap);}
</script>
</body>
</html>
