services:
  typesense:
    image: typesense/typesense:27.0
    container_name: octra-typesense
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=octra-typesense-key
      - TYPESENSE_ENABLE_CORS=true
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    networks:
      - octra-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: octra-postgres
    environment:
      POSTGRES_USER: octra
      POSTGRES_PASSWORD: octra_password
      POSTGRES_DB: octra
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - octra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: octra-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - octra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ocawe — AI runtime engine. Each user normally gets their own instance
  # launched inside a Nix environment. This dev instance is used for testing
  # and development; the backend proxies chat/workflow requests to it when
  # OCAWE_ADDR is set.
  ocawe:
    build:
      context: ./ocawe
      dockerfile: Dockerfile
    container_name: octra-ocawe
    environment:
      - OCAWE_PORT=4111
      - OCAWE_WORKFLOWS_ROOT=/ocawe/workflows
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - COGNICORE_MOCK_LLM=${COGNICORE_MOCK_LLM:-1}
    ports:
      - "4111:4111"
    volumes:
      - ocawe_workflows:/ocawe/workflows
    networks:
      - octra-network
    restart: unless-stopped

  # backend — the Octra monolith. Replaces the former user / agents /
  # orchestrator / apigateway microservices with a single Go service that
  # aggregates AI CLIs and exposes a personal MCP endpoint per user.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: octra-backend
    env_file:
      - .env
    environment:
      - HTTP_ADDR=:8080
      - DB_DNS=host=postgres user=octra password=octra_password dbname=octra port=5432 sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENTS_DIR=/var/lib/octra/environments
      - CLI_TTL=30m
      - SKILL_SYNC_DISABLED=1
      - TYPESENSE_HOST=typesense:8108
      - TYPESENSE_API_KEY=octra-typesense-key
    ports:
      - "8080:8080"
    volumes:
      - octra_environments:/var/lib/octra/environments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    networks:
      - octra-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
        - VITE_FRONTEND_MODE
    container_name: octra-frontend
    env_file:
      - .env
      - .env.prod
    environment:
      - FRONTEND_PORT=80
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - octra-network
    restart: unless-stopped

  # poster:
