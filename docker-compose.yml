services:
  postgres:
    image: postgres:15-alpine
    container_name: crewai-postgres
    environment:
      POSTGRES_USER: crewai
      POSTGRES_PASSWORD: crewai_password
      POSTGRES_DB: crewai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - octra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crewai-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - octra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # orchestrator — единый процесс с boss + manager + worker внутри.
  # Раньше это были три отдельных gRPC-сервиса; теперь все вызовы
  # между ролями идут напрямую через Go, без gRPC.
  orchestrator:
    build:
      context: .
      dockerfile: ./orchestrator/Dockerfile
    container_name: crewai-orchestrator
    environment:
      - DB_DNS=host=postgres user=crewai password=crewai_password dbname=crewai port=5432
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - AGENTS_SERVICE_HOST=agents:50053
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - PROJECTS_DIR=/workspace/projects
      - GIT_USER_EMAIL=zaharenkopasa06@gmail.com
      - GIT_USER_NAME=CrewAI Orchestrator
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ORCHESTRATOR_GRPC_PORT=50052
    ports:
      - "50052:50052"
    volumes:
      - ./projects:/workspace/projects
    depends_on:
      postgres:
        condition: service_healthy
      agents:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - octra-network
    restart: unless-stopped

  agents:
    build:
      context: .
      dockerfile: ./agents/Dockerfile
    container_name: crewai-agents
    environment:
      - AGENTS_PORT=50053
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - ZAI_API_URL=https://api.z.ai/api/v1
    ports:
      - "50053:50053"
    networks:
      - octra-network
    restart: unless-stopped

  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: crewai-apigateway
    env_file:
      - .env
    environment:
      - BOSS_SERVICE_HOST=orchestrator:50052
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - AUTH_SERVICE_HOST=user:3112
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      # Rate Limiting
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_TASK_CREATE=${RATE_LIMIT_TASK_CREATE:-10/60}
      - RATE_LIMIT_TASK_STATUS=${RATE_LIMIT_TASK_STATUS:-60/60}
      - RATE_LIMIT_TASK_RECONNECT=${RATE_LIMIT_TASK_RECONNECT:-30/60}
      - RATE_LIMIT_HEALTH=${RATE_LIMIT_HEALTH:-120/60}
    ports:
      - "3111:3111"
    depends_on:
      orchestrator:
        condition: service_started
      agents:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - octra-network
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: ./user/Dockerfile
    container_name: crewai-user
    env_file:
      - .env
    environment:
      - DB_DNS=host=postgres user=crewai password=crewai_password dbname=crewai port=5432
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-refresh-in-production}
      - AUTH_PORT=3112
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-1339826}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-test_StL4_VJfVFbOJ7_BbolU2VhoR1zjIQ7Qf2gcwN3Gngw}

      # LeFine / Kefine integration (Login with LeFine)
      # For local dev: points to your local Kefine at http://localhost:5173
      - LEFINE_BASE_URL=${LEFINE_BASE_URL:-http://localhost:5173}
      - LEFINE_REDIRECT_URL=${LEFINE_REDIRECT_URL:-http://localhost/auth/lefine/callback}
      - LEFINE_INTEGRATION_SECRET=dev-only-lefine-octra-shared-secret-change-me
    ports:
      - "3112:3112"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - octra-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        - VITE_FRONTEND_MODE
    container_name: crewai-frontend
    env_file:
      - .env
      - .env.prod
    environment:
      - FRONTEND_PORT=80
    ports:
      - "80:80"
    depends_on:
      user:
        condition: service_started
      apigateway:
        condition: service_started
    networks:
      - octra-network
    restart: unless-stopped

  poster:
    build:
      context: ./poster
      dockerfile: Dockerfile
    container_name: crewai-poster
    env_file:
      - .env
    environment:
      - TG_BOT_TOKEN_POSTER=${TG_BOT_TOKEN_POSTER}
      - CHANNEL_ID=@octra_ai
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=crewai
      - POSTGRES_PASSWORD=crewai_password
      - POSTGRES_DB=crewai
      - BASE_ULR=${BASE_ULR:-https://api.gonkagate.com/v1/chat/completions}
      - API_KEY=${API_KEY}
      - AI_MODEL=${AI_MODEL:-moonshotai/kimi-k2.6}
      - POLL_INTERVAL=5400
      - REPO_ROOT=/repo
    volumes:
      - .:/repo:ro
    working_dir: /repo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - octra-network
    restart: unless-stopped

  # tgbot:
    # build:
      # context: ./tgbot
      # dockerfile: Dockerfile
    # container_name: crewai-tgbot
    # env_file:
      # - ./tgbot/.env
    # environment:
      # - AUTH_API_URL=http://user:3112
      # - API_GATEWAY_URL=ws://apigateway:3111
    # depends_on:
      # user:
        # condition: service_started
      # apigateway:
        # condition: service_started
    # networks:
      # - crewai-network
    # restart: unless-stopped

networks:
  octra-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
